<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
            font-family: Arial, sans-serif;
            color: #111;
            padding: 20px;
        }

        main {
            width: min(100%, 460px);
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.08);
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.95rem;
            margin-top: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: fit-content;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            background-color: #f7f8fb;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e1e5eb;
        }

        #info {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .good-info,
        .bad-info {
            padding: 0.9rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .good-info {
            background-color: #e6ffed;
            color: #1f7a3a;
        }

        .bad-info {
            background-color: #ffe9e9;
            color: #a83232;
        }

        li p {
            margin: 0;
            line-height: 1.8;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <main>
        <h1>Aplicación de Productos</h1>
            <div id="info"></div><!--Show info about the inputs-->

        <form id="product-form"> <!--Form to get data from the user-->
            <label for="product-name">Product Name:</label>
            <input type="text" id="product-name" name="product-name" required />

            <label for="product-price">Product Price:</label>
            <input type="number" id="product-price" name="product-price" required />

            <label for="product-description">Product Description:</label>
            <input type="text" id="product-description" name="product-description" required />

            <button type="submit" id="add-btn">Add Product</button> <!--Button to submit the form-->
        </form>
        <ul id="product-list"></ul><!--List to show the products-->
    </main>

    <script src="./app.js"></script>
</body>

</html>
