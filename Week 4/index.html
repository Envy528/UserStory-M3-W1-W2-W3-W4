<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center ;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            max-width: 400px;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: #f9f9f9;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        #info {
            display: flex;
            justify-content: center;
        }
        .good-info {
            padding: 1rem;
            border-radius: 10px;
            background-color: #56ff6479;
        }

        .bad-info {
            padding: 1rem;
            border-radius: 10px;
            background-color: #ff565679;
        }
    </style>
</head>

<body>
    <main>
        <h1>Aplicación de Productos</h1>
            <div id="info"></div><!--Show info about the inputs-->

        <form id="product-form"> <!--Form to get data from the user-->
            <label for="product-name">Product Name:</label>
            <input type="text" id="product-name" name="product-name" required />

            <label for="product-price">Product Price:</label>
            <input type="number" id="product-price" name="product-price" required />

            <label for="product-description">Product Description:</label>
            <input type="text" id="product-description" name="product-description" required />

            <button type="submit" id="add-btn">Add Product</button> <!--Button to submit the form-->
        </form>
        <ul id="product-list"></ul><!--List to show the products-->

    </main>

    <script src="./app.js"></script>
</body>

</html>
